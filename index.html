<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Volume Discount</title>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var shop = params.get('shop') || params.get('host');
      if (shop) {
        var storeHandle = shop.replace(/\.myshopify\.com$/i, '').replace(/\?.*$/, '').trim() || shop;
        // automatic-app = uygulama indirimi formu (Smart Volume Discount buradan seçilir). Çalışmazsa /discounts/new kullan.
        var path = '/discounts/new/automatic-app';
        var adminUrl = 'https://admin.shopify.com/store/' + encodeURIComponent(storeHandle) + path;
        window.location.replace(adminUrl);
        return;
      }
      document.documentElement.classList.add('no-redirect');
    })();
  </script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 36em; margin: 4em auto; padding: 0 1em; line-height: 1.5; color: #333; }
    h1 { font-size: 1.25rem; }
    p { margin: 1em 0; }
    a { color: #008060; }
    .no-redirect body { margin-top: 2em; }
  </style>
</head>
<body>
  <h1>Smart Volume Discount</h1>
  <p>Redirecting to Shopify Admin...</p>
  <p class="fallback" style="display:none;">Store not found. To create a discount, go to the <strong>Sales → Discounts → Create discount</strong> page in Shopify Admin and select the <strong>Smart Volume Discount</strong> app discount.</p>
  <script>
    if (document.documentElement.classList.contains('no-redirect')) {
      document.querySelector('.fallback').style.display = 'block';
      document.querySelectorAll('p')[1].textContent = '';
    }
  </script>
</body>
</html>
